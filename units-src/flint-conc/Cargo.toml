[package]
name = "flint-conc"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib"]

[features]
# The manifest generator is host-only: it links std.
host-tools = []
# Forwarded so `cargo test -p flint-conc --features diagnostics` exercises the
# instrumented runtime (DECISIONS.md#two-builds).
diagnostics = ["flint-rt/diagnostics"]

[[bin]]
name = "manifest"
required-features = ["host-tools"]

# The HOST side of the port protocol, driving a real image. Its transcript is
# what `bin/conform-hosts` compares the JVM and CLR drivers against.
#
# `required-features` is not decoration: it links `std` and `flint_rt::native`,
# neither of which exists on wasm32, and without the gate a workspace-wide
# `cargo build --target wasm32-unknown-unknown` fails on it -- which is exactly
# what `bin/build-units` does, so the whole distributable stopped building.
[[bin]]
name = "hostports"
required-features = ["host-tools"]

[dependencies]
flint-rt = { path = "../../runtime" }
