[package]
name = "flint"
version = "0.0.1"
edition = "2021"
description = "Compile pure Clojure and run it in a sandbox, natively."
license = "MIT"

[dependencies]
# The runtime, compiled NATIVELY. It is the same Rust the wasm module is built
# from -- same collector, same interpreter, same builtins -- so a sandbox here
# is not a wasm engine wrapped in Rust (`DECISIONS.md#other-hosts`).
# `parallel`: several executors inside one sandbox (`DECISIONS.md#drivers`).
# On here and off in the wasm build, because that is the target that can use
# it -- native threads on a real shared heap, no wasm threads proposal needed.
flint-rt = { path = "../../runtime", features = ["parallel"] }
# THE CONCURRENCY UNIT'S BUILTINS, which a natively-linked host has to hand over
# because there is no wasm table to look them up in. Every image carries the
# control plane (`DECISIONS.md#bridges-are-the-only-door`) and bootstrap SPAWNS
# it, so every image needs `flint/spawn` -- and without this the SDK could not
# load any image at all. `cli/` and `nativeabi/` already link it for the same
# reason.
flint-conc = { path = "../../units-src/flint-conc" }

[features]
default = []
# The C ABI, for the C and C++ SDKs. A separate crate type would build a
# dynamic library nobody wants when using this from Rust.
capi = []
