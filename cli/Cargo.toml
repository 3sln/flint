[package]
name = "flint-cli"
version = "0.0.1"
edition = "2021"
description = "The flint compiler as a single binary: no babashka, no JVM, no linker."

[[bin]]
name = "flint"
path = "src/main.rs"

[dependencies]
# flint's own runtime, compiled NATIVELY. It is the same Rust the wasm module
# is built from -- the same collector, the same interpreter, the same builtins.
# There is no wasm runtime in this binary.
#
# THIS COMMENT USED TO CLAIM 2.7 s AGAINST 15.6 s -- 5.8x -- and that figure
# was the whole argument for the native binary. Re-measured 2026-09-11 against
# `@3sln/flint-cli` (`DECISIONS.md#npm-cli`), which runs the same compiler on
# node over wasm: 1.63x on a four-namespace project, 1.71x on the compiler
# compiling itself. Not 5.8x.
#
# The new measurement is trustworthy where earlier attempts were not, and for
# one reason: the two arms emit BYTE-IDENTICAL modules across six cases,
# including the compiler compiling itself at 964 177 bytes. That is the proof
# they do the same work. Three earlier attempts compared arms that did
# different amounts of the pipeline and produced ratios between pipelines.
#
# The old figure is not retracted as false -- nobody can re-run it, the host
# and machine are unrecorded -- but it should not be cited as current.
flint-rt = { path = "../runtime" }
# Green threads and ports are a namespace UNIT, not part of the runtime
# (`DECISIONS.md#namespace-units`). A wasm module links it when a program reaches it; a
# natively-linked binary has to carry it, or `flint run` cannot execute a
# program that spawns a thread.
flint-conc = { path = "../units-src/flint-conc" }
# JSON and XML are units too, and the CLI's OWN dependency code parses
# manifests with them -- `package.json`, `pom.xml`. Without these linked,
# `flint run` refuses any program that calls one, which included the CLI
# parsing the manifests it exists to read.
flint-data-json = { path = "../units-src/flint-data-json" }
flint-data-xml = { path = "../units-src/flint-data-xml" }
anyhow = "1"
ureq = { version = "3.4.0", default-features = false, features = ["rustls"] }
flate2 = "1.1.10"
tar = "0.4.46"
zip = "8.6.0"
semver = "1.0.28"
sha2 = "0.11.0"
hex = "0.4.3"
serde_json = "1.0.151"
rmp-serde = "1.3.1"
serde = "1.0.229"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
