[package]
name = "flint-cli"
version = "0.0.1"
edition = "2021"
description = "The flint compiler as a single binary: no babashka, no JVM, no linker."

[[bin]]
name = "flint"
path = "src/main.rs"

[dependencies]
# flint's own runtime, compiled NATIVELY. It is the same Rust the wasm module
# is built from -- the same collector, the same interpreter, the same builtins
# -- so running the compiler here is 2.7 s against 15.6 s through a wasm
# engine (`doc/decisions/0010`). There is no wasm runtime in this binary.
flint-rt = { path = "../runtime" }
anyhow = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
