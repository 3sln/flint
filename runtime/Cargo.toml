[package]
name = "flint-rt"
version = "0.1.0"
edition = "2021"
description = "flint runtime: NaN-boxed values, generational GC, persistent data structures, EDN reader and bytecode VM, for wasm32-unknown-unknown"

[lib]
# rlib only: flint drives the final link itself (doc/unit-format.md), so there
# is no cdylib target -- and having one would duplicate the allocator shim
# symbols this crate defines by hand.
crate-type = ["rlib"]

[features]
# The catalogue generator is host-only: it links std, which would collide with
# the runtime's own panic handler under wasm32.
host-tools = []

# Several executors inside one sandbox (DECISIONS.md#drivers). ABSENT by default,
# on the same rule as `aot` and `diagnostics`: it costs 1 056 bytes of module,
# MEASURED by building the pure module with the multi-executor root scan and
# without it (245 901 against 244 845), and wasm cannot use it at all until it
# has the threads proposal and a shared memory. A module that can only ever
# have one executor should not carry the loop that walks the others.
parallel = []

# Compiled arities (DECISIONS.md#emit-wasm-instead-of-dispatch). ABSENT by default, for the same reason
# diagnostics are: it costs 7 002 bytes of production module, and 0009 already
# spent a chosen budget on instantiating the loop twice. A module that never asks
# for compiled code should not carry the machinery that runs it.
aot = []

# Diagnostic machinery (DECISIONS.md#two-builds). ABSENT by default, not disabled:
# a runtime flag leaves the code linked and branched on, and "absent" is a
# different guarantee from "off" -- which matters most for a VM whose strongest
# case is sandboxing code somebody else wrote. Gas, the memory cap and the
# deterministic scheduler are NOT here: they are production features.
diagnostics = []

# The two map-iteration shapes side by side, for `examples/iterbench.rs`. The
# runtime iterates with a callback; both ports iterate with a buffer, and
# deciding between them needed both in ONE runtime rather than one per runtime.
# ABSENT by default because the buffer shape LOST -- it is kept only so the
# number stays re-runnable, and a benchmark you cannot re-run is a claim.
bench = []

[[bin]]
name = "catalogue"
required-features = ["host-tools"]

[[bin]]
name = "bench"
required-features = ["host-tools"]

[dependencies]
# Pure-Rust no_std libm. The only dependency: it is what makes clojure.math
# possible in a bare wasm build (no libc, no JVM Math).
libm = { version = "0.2", default-features = false }

# The opcode-coverage instrument reads the diagnostics census, so it only
# exists in that build. Declared rather than `#[cfg]`-ed out, so
# `cargo test -p flint-rt` -- which builds every example -- does not try to
# compile it without the feature and fail on `stat_region`.
[[example]]
name = "opcov"
required-features = ["diagnostics"]

[[example]]
name = "livedump"
required-features = ["diagnostics"]

[[example]]
name = "iterbench"
required-features = ["bench"]
