name: Binaries

# The single binary, for every platform we claim to support.
#
# `flint` embeds the compiler, both runtime modules and the standard library,
# and drives them through wasmtime IN-PROCESS. So there is nothing to install
# alongside it -- no babashka, no JVM, no linker -- and cargo cross-compiles it
# with no extra toolchain, which is why this is a plain matrix rather than a
# `wasmer create-exe` step.
#
# The wasm artifacts it embeds are GENERATED, not tracked, so every job builds
# them first with `bin/build-dist`.

# CALLED by `publish.yml` with the tag it just released. Not triggered by the
# release event: a release created with the workflow's own token does not fire
# `release: published` for other workflows, so waiting for it would mean the
# binaries never build. By hand, with no tag, it builds and uploads artifacts
# to the run and attaches nothing.
on:
  workflow_call:
    inputs:
      tag:
        description: The release tag to build from and attach the binaries to.
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: A release tag to build from and attach to (empty for the current ref, attaching nothing).
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: binaries-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: flint-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: flint-linux-aarch64
          - os: macos-13
            target: x86_64-apple-darwin
            name: flint-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: flint-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: flint-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # PINNED to bin/nightly-toolchain, not the rolling `nightly` alias
      # (DECISIONS.md#pin-the-nightly-toolchain).
      - name: Set up Rust nightly with the wasm32 target
        shell: bash
        run: |
          NIGHTLY="$(cat bin/nightly-toolchain)"
          rustup toolchain install "$NIGHTLY" --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain "$NIGHTLY"
          rustup target add ${{ matrix.target }} --toolchain "$NIGHTLY"
          rustup component add rust-src --toolchain "$NIGHTLY"

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # PINNED to bin/bb-version, not the rolling `latest` alias
      # (DECISIONS.md#pin-the-babashka-version).
      - name: Read the pinned Clojure CLI version
        id: clojure-version
        run: echo "version=$(cat bin/clojure-version)" >> "$GITHUB_OUTPUT"

      - name: Read the pinned babashka version
        id: bb-version
        shell: bash
        run: echo "version=$(cat bin/bb-version)" >> "$GITHUB_OUTPUT"

      - uses: DeLaGuardo/setup-clojure@13
        with:
          bb: ${{ steps.bb-version.outputs.version }}
          # bin/flint is a JVM-Clojure driver now; pinned like bb (bin/clojure-version).
          cli: ${{ steps.clojure-version.outputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The embedded artifacts. This is also the honest test that the release
      # can be built from a clean checkout on this platform.
      - name: Build the wasm distributable
        shell: bash
        run: ./bin/build-dist

      - name: Build the binary
        shell: bash
        # Remapped (DECISIONS.md#reproducible-build-paths): without this, the
        # shipped binary embeds the runner's own checkout path
        # (`/home/runner/work/...`, `/Users/runner/work/...`, or the
        # Windows equivalent) and its cargo-registry cache path in every
        # panic location, so a `flint-linux-x86_64` built today and one built
        # from the same commit tomorrow are not byte-identical.
        run: |
          export RUSTFLAGS="$(./bin/rust-remap-flags) ${RUSTFLAGS:-}"
          cargo +nightly build -p flint-cli --release --target ${{ matrix.target }}

      # A binary that builds and cannot compile a program is not a release
      # artifact. Every platform proves it for itself.
      - name: Compile and run a program with it
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/flint"
          [ -f "$bin" ] || bin="$bin.exe"
          mkdir -p /tmp/smoke
          printf '(ns smoke)\n(defn main [args] (str "ok " (reduce + 0 (range 10))))\n' > /tmp/smoke/smoke.cljc
          "$bin" version
          "$bin" compile :path /tmp/smoke :fn smoke/main :to :wasm :out /tmp/smoke/out.wasm
          got="$("$bin" run :path /tmp/smoke :fn smoke/main)"
          echo "got: $got"
          [ "$got" = "ok 45" ] || { echo "::error::the binary produced '$got', not 'ok 45'"; exit 1; }

      - name: Name it for the release
        shell: bash
        run: |
          set -euo pipefail
          src="target/${{ matrix.target }}/release/flint"
          [ -f "$src" ] || src="$src.exe"
          cp "$src" "${{ matrix.name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

      - name: Attach it to the release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: gh release upload "$TAG" "${{ matrix.name }}" --clobber
