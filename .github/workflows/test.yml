name: Test

# Runs the full suite on pull requests only.
#
# Deliberately not on every push to main: `bin/test` builds both configurations
# of the runtime (doc/decisions/0016), compiles the units with rustc, and runs
# the self-hosting fixpoint — several minutes of work. The gate belongs on the
# proposal, not on every commit that lands after it has already passed.
#
# This is the same `./bin/test` as locally. It fails loudly and skips nothing.

on:
  pull_request:
  # For running the suite against main by hand, e.g. before cutting a release.
  workflow_dispatch:

permissions:
  contents: read

# A newer commit on the same branch makes an in-flight run pointless.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # 45 for the ordinary pull-request run; the by-hand release run also does
    # self-hosting on both ports, which is about 15 minutes more.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Nightly, because the unit objects are emitted by rustc directly against
      # the wasm32 sysroot rather than through cargo (see bin/build-units).
      - name: Set up Rust nightly with the wasm32 target
        run: |
          rustup toolchain install nightly --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: wasm32-nightly

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # flint is written in portable cljc and bootstraps on babashka; the
      # compiler, the test harness and the differential Clojure check all run
      # under `bb`.
      - name: Set up babashka
        uses: DeLaGuardo/setup-clojure@13
        with:
          bb: latest

      # The JVM port. 25 rather than the minimum 24, because `java.lang.classfile`
      # is what the AOT emitter uses and 24 is where it was finalised -- pinning
      # to the floor would mean CI never exercises anything newer.
      - name: Set up the JDK for the JVM port
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # The CLR port. `runtimes/clr/conform` targets net10.0.
      - name: Set up .NET for the CLR port
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        env:
          # Without this, `bin/conform-hosts` SKIPS the JVM and CLR rows when a
          # toolchain is missing and the suite still exits 0 -- so a green run
          # would prove nothing about either port. With it, a missing toolchain
          # is a failure that says which one.
          FLINT_REQUIRE_HOSTS: '1'
          # Self-hosting on the ports is 179 s on the JVM and 704 s on the CLR
          # against about a minute for everything else, so it is not a
          # per-proposal gate. `workflow_dispatch` is the release check, and
          # that is what the run-by-hand trigger at the top exists for.
          FLINT_SELFHOST: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: ./bin/test
