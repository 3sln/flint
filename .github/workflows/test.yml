name: Test

# Manual only -- there is no pull_request or push trigger. `bin/test` builds
# both configurations of the runtime (DECISIONS.md#two-builds), compiles the
# units with rustc, and runs the self-hosting fixpoint on request: 39-50 min
# quiet, longer loaded (AGENTS.md#4), and unmeasured on this runner's 4 cores.
# Dispatch it by hand before a release, or whenever a change needs the full
# four-runtime gate rather than the fast local tier.
#
# This is the same `./bin/test` as locally. It fails loudly and skips nothing.

on:
  workflow_dispatch:
    inputs:
      keep_going:
        description: >-
          Run every section and list all red at the end, instead of stopping
          at the first failure (FLINT_TEST_KEEP_GOING).
        type: boolean
        default: true
      selfhost:
        description: >-
          Also self-host on the JVM and CLR ports (FLINT_SELFHOST) -- about
          15 more minutes.
        type: boolean
        default: false
      kin_ref:
        description: >-
          Ref of the public 3sln/kin repo to check out as the ../kin sibling
          bb.edn's :local/root expects.
        type: string
        default: main

permissions:
  contents: read

# A newer commit on the same branch makes an in-flight run pointless.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # bin/test is 39-50 min on a quiet Mac (AGENTS.md#4); unmeasured here, and
    # workflow_dispatch can also ask for self-hosting on top. Generous rather
    # than guessed.
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # kin is the separate public repo 3sln/kin: the source-to-source
      # generator itself (the LANGUAGE -- defn, let, if, case, the operators),
      # kept out of this tree so it can't drift from its own three-target
      # output by hand. bb.edn resolves it via `:deps {io.github.3sln/kin
      # {:local/root "../kin"}}` -- a sibling of this checkout, one directory
      # above $GITHUB_WORKSPACE. actions/checkout can only write inside the
      # workspace, so it is checked out to a subdirectory here and then moved
      # out to the sibling position the dependency expects.
      - name: Check out 3sln/kin
        uses: actions/checkout@v4
        with:
          repository: 3sln/kin
          ref: ${{ inputs.kin_ref }}
          path: kin-sibling-checkout

      - name: Place 3sln/kin at ../kin
        run: mv kin-sibling-checkout ../kin

      # Nightly, because the unit objects are emitted by rustc directly against
      # the wasm32 sysroot rather than through cargo (see bin/build-units).
      # PINNED to bin/nightly-toolchain, not the rolling `nightly` alias
      # (DECISIONS.md#pin-the-nightly-toolchain): an unpinned nightly fetched
      # the day this runs can change where cargo places a build-script
      # dependency's rlib under cross-compilation, which bin/build-units'
      # `rlib()` does not expect.
      - name: Set up Rust nightly with the wasm32 target
        run: |
          NIGHTLY="$(cat bin/nightly-toolchain)"
          rustup toolchain install "$NIGHTLY" --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain "$NIGHTLY"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: wasm32-nightly

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # flint is written in portable cljc and bootstraps on babashka; the
      # compiler, the test harness and the differential Clojure check all run
      # under `bb`.
      #
      # PINNED to bin/bb-version, not the rolling `latest` alias
      # (DECISIONS.md#pin-the-babashka-version): `bin/manifest`'s comparison
      # against `clojure.core` reads the EXECUTING babashka's own published
      # vars, and a newer babashka changes which internal names it publishes
      # there. `latest` made `doc/manifest.edn`/README.md/`doc/coverage.md`
      # regenerate different on Linux CI than on the macOS box that last
      # generated them, with no source change.
      - name: Read the pinned babashka version
        id: bb-version
        run: echo "version=$(cat bin/bb-version)" >> "$GITHUB_OUTPUT"

      - name: Set up babashka
        uses: DeLaGuardo/setup-clojure@13
        with:
          bb: ${{ steps.bb-version.outputs.version }}

      # The JVM port. 25 rather than the minimum 24, because `java.lang.classfile`
      # is what the AOT emitter uses and 24 is where it was finalised -- pinning
      # to the floor would mean CI never exercises anything newer.
      - name: Set up the JDK for the JVM port
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # The CLR port. `runtimes/clr/conform` targets net10.0.
      - name: Set up .NET for the CLR port
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        env:
          # Without this, `bin/conform-hosts` SKIPS the JVM and CLR rows when a
          # toolchain is missing and the suite still exits 0 -- so a green run
          # would prove nothing about either port. With it, a missing toolchain
          # is a failure that says which one.
          FLINT_REQUIRE_HOSTS: '1'
          # bin/test stops at the first red section by default; keep_going
          # runs the rest and lists every red at the end (AGENTS.md#4).
          FLINT_TEST_KEEP_GOING: ${{ inputs.keep_going && '1' || '0' }}
          # Self-hosting on the ports is 179 s on the JVM and 704 s on the CLR
          # against about a minute for everything else, so it defaults off.
          FLINT_SELFHOST: ${{ inputs.selfhost && '1' || '0' }}
        run: ./bin/test
