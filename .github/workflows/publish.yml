name: Publish

# A version bump in a package's `package.json` publishes that package.
#
# `bin/release-plan` is the one list of what this repository publishes, and it
# decides by asking the REGISTRY whether each package's version is already
# there -- not by diffing against the parent commit. So a first release, a run
# that failed half way (one package out, the other not) and a bump that landed
# while this workflow was broken are all caught the same way: the next run
# publishes whatever the registry does not have yet, and nothing else.
#
# `bin/set-version` writes `meta.edn`'s version into every manifest at once and
# `bin/check-version` gates that they agree, so in practice a bump names both
# packages and one tag, `v<version>`.
#
# Requires an `NPM_TOKEN` repository secret: an npm automation token with
# publish rights on the @3sln scope.

on:
  push:
    branches:
      - main
    paths:
      - sdks/esm/package.json
      - sdks/cli/package.json
      - bin/release-plan
      - .github/workflows/publish.yml
  # Publishes whatever the registry lacks. Safe to run at any time: a version
  # that is already published is skipped, not republished.
  workflow_dispatch:

permissions:
  contents: write
  # Required for npm provenance. Drop this, and the --provenance flags below,
  # if the repository is ever made private: provenance only works for packages
  # published from a public repository.
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
      any: ${{ steps.plan.outputs.any }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: What does the registry not have yet?
        id: plan
        run: |
          set -euo pipefail
          ./bin/release-plan
          ./bin/release-plan --json > /dev/null   # writes `packages` and `any`
          echo "tag=v$(node -p "require('./sdks/esm/package.json').version")" >> "$GITHUB_OUTPUT"

  publish:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # PINNED to bin/nightly-toolchain, not the rolling `nightly` alias
      # (DECISIONS.md#pin-the-nightly-toolchain).
      - name: Set up Rust nightly with the wasm32 target
        run: |
          NIGHTLY="$(cat bin/nightly-toolchain)"
          rustup toolchain install "$NIGHTLY" --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain "$NIGHTLY"

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32-nightly

      - uses: DeLaGuardo/setup-clojure@13
        with:
          bb: latest

      # The whole gate, from the commit being published. It also leaves the
      # tree in the PRODUCTION configuration (DECISIONS.md#two-builds), which is
      # the one that must ship.
      - name: Test
        run: ./bin/test

      - name: Check the production units are present and diagnostics-free
        run: |
          set -euo pipefail
          test -f units/flint/rt.unit.edn || { echo '::error::units/ was not built'; exit 1; }
          if grep -q 'stat_bytes_allocated' units/flint/rt.unit.edn; then
            echo '::error::units/ carries the diagnostics build; publish must ship the stripped one.'
            exit 1
          fi

      - name: Build the wasm distributable
        run: ./bin/build-dist

      # Each package the plan named: its own build, its own self-test against
      # what was just built, a dry run that shows the tarball, then the publish.
      # FLINT_DIST_FRESH: the distributable was built one step up, and the
      # package builds would otherwise rebuild it.
      - name: Build, test and publish each package
        env:
          PACKAGES: ${{ needs.plan.outputs.packages }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          FLINT_DIST_FRESH: '1'
        run: |
          set -euo pipefail
          echo "$PACKAGES" | node -e '
            let s = ""; process.stdin.on("data", (d) => s += d).on("end", () => {
              for (const p of JSON.parse(s)) console.log([p.dir, p.name, p.version, p.build, p.test].join("\t"));
            });' |
          while IFS="$(printf '\t')" read -r dir name version build test; do
            echo "::group::$name@$version"
            sh -c "$build"
            sh -c "$test"
            (cd "$dir" && npm pack --dry-run)
            (cd "$dir" && npm publish --access public --provenance)
            echo "Published \`$name@$version\`." >> "$GITHUB_STEP_SUMMARY"
            echo "::endgroup::"
          done

      - name: Tag and release, with the distributable attached
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" \
            dist/flintc.wasm dist/flint-loader.wasm \
            dist/flint-runtime.wasm dist/flint-runtime-aot.wasm \
            dist/builtins.json dist/slots.json dist/slots-aot.json \
            --clobber

  # CALLED, not triggered: a release created with the workflow's own token does
  # not fire `release: published` for other workflows, so waiting for that
  # event would mean the binaries never build.
  binaries:
    needs: [plan, publish]
    uses: ./.github/workflows/binaries.yml
    with:
      tag: ${{ needs.plan.outputs.tag }}
    permissions:
      contents: write
