name: Deploy Deck to GitHub Pages

on:
  push:
    branches:
      - main
    # The deck is markdown split out of the README, so a push that touches
    # neither cannot change the site.
    paths:
      - 'deck/**'
      - '.github/workflows/deploy-deck.yml'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        working-directory: ./deck
        run: bun install

      - name: Build
        working-directory: ./deck
        run: bun run build

      # Pages serves the custom domain from a CNAME file in the artifact. It is
      # written here rather than committed into deck/ because deck-build treats
      # every file under its root as a card, and a stray CNAME card would show
      # up in the deck itself.
      - name: Write the CNAME
        run: echo 'flint.3sln.com' > ./deck/out/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload the output directory from the build
          path: './deck/out'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
